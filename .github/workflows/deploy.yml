name: Deploy MERN App to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOYMENT_PATH: /home/${{ secrets.SSH_USERNAME }}/apps/mern-app
  NODE_VERSION: '22.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      # Build Server
      - name: Install server dependencies
        run: cd server && npm ci
      
      - name: Check server TypeScript
        run: cd server && npm run build 2>/dev/null || true
      
      # Build Client
      - name: Install client dependencies
        run: cd client && npm ci
      
      - name: Build client for production
        run: cd client && npm run build
      
      - name: Lint client code
        run: cd client && npm run lint 2>/dev/null || echo "Linting warnings (non-blocking)"
      
      - name: Check build artifacts
        run: |
          ls -la client/dist/
          echo "Client build successful!"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      
      - name: Deploy to hosting server
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
          "DEPLOYMENT_PATH=$DEPLOYMENT_PATH" 'bash -s' << 'EOF'
          set -e
          
          # Now $DEPLOYMENT_PATH will have the correct value
          if [ ! -d "$DEPLOYMENT_PATH" ]; then
            mkdir -p "$DEPLOYMENT_PATH"
            cd "$DEPLOYMENT_PATH"
            git clone https://github.com/${{ github.repository }}.git .
          else
            cd "$DEPLOYMENT_PATH"
            git fetch origin
            git reset --hard origin/main
          fi
          
          # ... rest of your script ...
          EOF
        env:
          DEPLOYMENT_PATH: /home/${{ secrets.SSH_USERNAME }}/apps/mern-app


      - name: Verify deployment
        run: |
          echo "✅ Deployment workflow completed!"
          echo "🌐 Your app should be live at: https://${{ secrets.SSH_HOST }}"
          echo "🔌 API available at: https://${{ secrets.SSH_HOST }}/api"
          echo "📊 Check server status: pm2 status (on your server)"
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
